# Put this file in the repo PrayerApp-releases at:  .github/workflows/notify.yml
# Every time notifications.json is changed on main, every phone that has the app gets a tiny "ping"
# and reads the file right away (the text comes from the file, not from the ping).
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT (the service-account JSON from Firebase, see README 2.9.5).
name: Notify phones

on:
  push:
    branches: [main]
    paths:
      - notifications.json
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Get a Firebase access token
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging

      - name: Send the ping to every phone
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          PROJECT=$(echo "$SERVICE_ACCOUNT" | jq -r .project_id)
          sleep 15   # let raw.githubusercontent.com serve the new file first
          curl -sS --fail-with-body -X POST \
            "https://fcm.googleapis.com/v1/projects/$PROJECT/messages:send" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"message"
